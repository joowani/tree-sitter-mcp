name: publish

run-name: Publish v${{ github.event.client_payload.version }}

on:
  # Send event_type=publish with client_payload.version through the repository dispatch API.
  repository_dispatch:
    types: [publish]

concurrency:
  group: publish-${{ github.event.client_payload.version }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.event.client_payload.version }}
  # Sent to the built server to check that it starts and answers.
  INITIALIZE_REQUEST: '{"jsonrpc":"2.0","id":0,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"publish","version":"1"}}}'

jobs:
  # The tag records the commit a version is built from, so dispatching the same version again completes a release that
  # failed partway:
  #
  # - With no tag, the current commit is tagged.
  # - While nothing of the version is published, the tag moves to the current commit, so a fix can be released.
  # - Once anything is published, the rest is built from the tagged commit, so the release never mixes two commits.
  #   The workflow itself still runs from the current commit, so fixes to it take effect.
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Validate release source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          expected_ref="refs/heads/$DEFAULT_BRANCH"
          if [[ "$GITHUB_REF" != "$expected_ref" ]]; then
              echo "release resolved to $GITHUB_REF instead of $expected_ref" >&2
              exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Choose the commit to release
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Succeeds if the URL exists and fails if it is missing; any other answer stops the release, since guessing
          # wrong could publish a mix of two commits.
          exists() {
              local status
              status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
                  --user-agent "tree-sitter-mcp-server release workflow (https://github.com/$GH_REPO)" "$1")"
              case "$status" in
                  200) return 0 ;;
                  404) return 1 ;;
                  *) echo "$1 answered $status" >&2; exit 1 ;;
              esac
          }

          published=()
          if exists "https://crates.io/api/v1/crates/tree-sitter-mcp-server/$VERSION"; then
              published+=("crate")
          fi
          for name in $(jq -r '.name, (.optionalDependencies | keys[])' npm/package.json); do
              if exists "https://registry.npmjs.org/${name/\//%2F}/$VERSION"; then
                  published+=("$name")
              fi
          done
          if [[ "$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null)" == false ]]; then
              published+=("GitHub release")
          fi

          if tag_ref_response="$(gh api --include "repos/$GH_REPO/git/ref/tags/v$VERSION" 2>&1)"; then
              tag_commit="$(gh api "repos/$GH_REPO/commits/v$VERSION" --jq .sha)"
          elif grep -qE '^HTTP/[0-9.]+ 404 ' <<<"$tag_ref_response"; then
              tag_commit=""
          else
              echo "GitHub could not confirm whether tag v$VERSION exists" >&2
              printf '%s\n' "$tag_ref_response" >&2
              exit 1
          fi

          if [[ -z "$tag_commit" ]]; then
              echo "tagging $GITHUB_SHA as v$VERSION"
              { echo "sha=$GITHUB_SHA"; echo "tag=create"; } >> "$GITHUB_OUTPUT"
          elif [[ "$tag_commit" == "$GITHUB_SHA" ]]; then
              { echo "sha=$GITHUB_SHA"; echo "tag=keep"; } >> "$GITHUB_OUTPUT"
          elif (( ${#published[@]} == 0 )); then
              echo "nothing of v$VERSION is published yet, so the tag moves from $tag_commit to $GITHUB_SHA"
              { echo "sha=$GITHUB_SHA"; echo "tag=move"; } >> "$GITHUB_OUTPUT"
          else
              echo "::notice::v$VERSION is partly published (${published[*]}), so the rest is built from $tag_commit"
              { echo "sha=$tag_commit"; echo "tag=keep"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the commit to release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.commit.outputs.sha }}

      - name: Validate version and tag the commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ steps.commit.outputs.sha }}
          TAG_ACTION: ${{ steps.commit.outputs.tag }}
        run: |
          scripts/publish --check "$VERSION"
          case "$TAG_ACTION" in
              create) gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$COMMIT" >/dev/null ;;
              move) gh api -X PATCH "repos/$GH_REPO/git/refs/tags/v$VERSION" -f sha="$COMMIT" -F force=true >/dev/null ;;
          esac

  check:
    name: Check
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ needs.validate.outputs.commit }}

  # One native runner per npm platform (`process.platform`-`process.arch`). Linux builds use musl, so the binaries are
  # static and also run on glibc systems.
  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-26
            npm: darwin-arm64
          - target: x86_64-apple-darwin
            runner: macos-26-intel
            npm: darwin-x64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-26.04-arm
            npm: linux-arm64
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
            npm: linux-x64
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            npm: win32-arm64
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            npm: win32-x64
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      NPM_PLATFORM: ${{ matrix.npm }}
      EXE: ${{ contains(matrix.target, 'windows') && '.exe' || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET" --no-self-update
          rustup default stable

      - name: Build binary
        run: cargo build --locked --release --target "$TARGET"

      # The runner is native, so the binary it built can answer an MCP initialize request.
      - name: Test MCP server binary
        run: |
          response="$(printf '%s\n' "$INITIALIZE_REQUEST" | "target/$TARGET/release/tree-sitter-mcp-server$EXE")"
          echo "$response"
          grep -q '"name":"tree-sitter-mcp-server"' <<<"$response"

      - name: Package binary
        run: |
          dir="tree-sitter-mcp-server-$TARGET"
          mkdir "$dir"
          cp "target/$TARGET/release/tree-sitter-mcp-server$EXE" LICENSE README.md "$dir"
          if [[ -n "$EXE" ]]; then
              7z a -tzip "$dir.zip" "$dir"
          else
              tar -czf "$dir.tar.gz" "$dir"
          fi

      # npm installs this package only on its platform, as an optional dependency of the tree-sitter-mcp-server package.
      - name: Package npm binary
        env:
          # Keeps macOS tar from adding AppleDouble files to the tarball.
          COPYFILE_DISABLE: 1
        run: |
          mkdir -p package/bin
          cp "target/$TARGET/release/tree-sitter-mcp-server$EXE" package/bin/
          cp LICENSE package/
          cat > package/package.json <<EOF
          {
            "name": "@joowani/tree-sitter-mcp-server-$NPM_PLATFORM",
            "version": "$VERSION",
            "description": "The $NPM_PLATFORM binary for tree-sitter-mcp-server",
            "repository": { "type": "git", "url": "git+https://github.com/joowani/tree-sitter-mcp-server.git" },
            "license": "MIT",
            "os": ["${NPM_PLATFORM%-*}"],
            "cpu": ["${NPM_PLATFORM#*-}"],
            "files": ["bin"]
          }
          EOF
          tar -czf "npm-$NPM_PLATFORM.tgz" package

      - name: Upload archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-${{ matrix.target }}
          path: |
            tree-sitter-mcp-server-${{ matrix.target }}.*
            npm-${{ matrix.npm }}.tgz
          if-no-files-found: error

  publish-crate:
    name: Publish Crate
    needs: [validate, check, build]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: scripts/publish "$VERSION"

  publish-npm:
    name: Publish npm Packages
    needs: [validate, check, build]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # npm/ and server.json are release metadata, so they come from the workflow's commit, like the workflow itself.
      # The binaries in the archives come from the commit being released.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archive-*
          path: artifacts
          merge-multiple: true

      # The committed package.json holds 0.0.0 for the package and its platform binaries.
      - name: Pack tree-sitter-mcp-server package
        run: |
          jq --arg version "$VERSION" '.version = $version | .optionalDependencies[] = $version' npm/package.json \
              > package.json.new
          mv package.json.new npm/package.json
          cp README.md LICENSE npm/
          tarball="$(npm pack ./npm --pack-destination artifacts | tail -n 1)"
          echo "COMMAND_TARBALL=artifacts/$tarball" >> "$GITHUB_ENV"

      - name: Test packages
        run: |
          cd "$RUNNER_TEMP"
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/artifacts/npm-linux-x64.tgz" \
              "$GITHUB_WORKSPACE/$COMMAND_TARBALL"
          response="$(printf '%s\n' "$INITIALIZE_REQUEST" | npx --no-install tree-sitter-mcp-server)"
          echo "$response"
          grep -q '"name":"tree-sitter-mcp-server"' <<<"$response"

      # The platform packages go first, so the command package never points at a binary that is not published yet.
      # Versions that are already published are skipped, so the job can be rerun after a partial failure.
      #
      # npm authenticates with trusted publishing. Trusted publishing can only be set up for packages that exist, so
      # the first release uses an NPM_TOKEN secret in the npm environment, which is deleted afterwards.
      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # The ./ prefix keeps npm from reading `artifacts/<file>` as a GitHub repository.
          for tarball in ./artifacts/npm-*.tgz "./$COMMAND_TARBALL"; do
              name="$(tar -xOzf "$tarball" package/package.json | jq -r .name)"
              if npm view "$name@$VERSION" version >/dev/null 2>&1; then
                  echo "$name $VERSION is already published; skipping"
              else
                  npm publish --access public "$tarball"
              fi
          done

  publish-release:
    name: Publish GitHub Release
    needs: [publish-crate, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archive-*
          path: artifacts
          merge-multiple: true

      # A published release is left alone, since rebuilt archives differ byte for byte from the ones already attached.
      # `gh release create` uploads to a draft before publishing it, so an interrupted run can leave a draft to finish.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd artifacts
          sha256sum tree-sitter-mcp-server-* > SHA256SUMS
          if ! is_draft="$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null)"; then
              gh release create "v$VERSION" --verify-tag --title "v$VERSION" --generate-notes tree-sitter-mcp-server-* SHA256SUMS
          elif [[ "$is_draft" == true ]]; then
              gh release upload "v$VERSION" --clobber tree-sitter-mcp-server-* SHA256SUMS
              gh release edit "v$VERSION" --draft=false
          else
              echo "release v$VERSION is already published; nothing to do"
          fi

  # The registry checks that the crate and the npm package are already published.
  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: [publish-crate, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # server.json is release metadata, so it comes from the workflow's commit, like the workflow itself.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mcp-publisher
        env:
          GH_TOKEN: ${{ github.token }}
          MCP_PUBLISHER_VERSION: 1.8.1
        run: |
          archive="mcp-publisher_linux_amd64.tar.gz"
          gh release download "v$MCP_PUBLISHER_VERSION" --repo modelcontextprotocol/registry \
              --pattern "$archive" --pattern "registry_${MCP_PUBLISHER_VERSION}_checksums.txt"
          grep " $archive\$" "registry_${MCP_PUBLISHER_VERSION}_checksums.txt" | sha256sum --check --strict
          tar -xzf "$archive" mcp-publisher

      # The committed server.json holds 0.0.0 for the server and its packages.
      - name: Set version in server.json
        run: |
          jq --arg version "$VERSION" '.version = $version | .packages[].version = $version' server.json > server.json.new
          mv server.json.new server.json

      - name: Publish server
        run: |
          name="$(jq -r .name server.json)"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              "https://registry.modelcontextprotocol.io/v0.1/servers/${name//\//%2F}/versions/$VERSION")"
          case "$status" in
              200)
                  echo "$name $VERSION is already in the MCP Registry; nothing to do"
                  ;;
              404)
                  ./mcp-publisher login github-oidc
                  ./mcp-publisher publish
                  ;;
              *)
                  echo "the MCP Registry answered $status while checking $name $VERSION" >&2
                  exit 1
                  ;;
          esac
